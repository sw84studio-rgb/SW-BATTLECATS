<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SW BATTLE CATS 백과 V037</title>
<link rel="stylesheet" href="css/encyclopedia-v037.css">
</head>
<body>
<header class="app-header">
  <button class="header-home" type="button" data-action="home">홈으로</button>
  <div class="brand">SW BATTLE CATS</div>
  <div class="version"><b>V037</b><small>판본 분리</small></div>
</header>
<div class="search-shell">
  <div class="platform-switch" aria-label="게임 판본">
    <button type="button" data-platform="mobile" class="active">모바일</button>
    <button type="button" data-platform="switch">Nintendo</button>
    <span id="platformDataVersion" class="platform-data-version">KR 15.5.0</span>
  </div>
  <div class="search-inner"><input id="searchInput" type="search" placeholder="캐릭터 이름 검색" autocomplete="off"></div>
</div>
<main id="app" class="app-main" aria-live="polite">
  <section id="catalogView" class="catalog-view">
    <div class="view-head"><div><h1 id="viewTitle">캐릭터 도감</h1><p id="viewSubtitle"></p></div><div id="resultCount" class="catalog-meta">0개</div></div>
    <div id="contentView"></div>
  </section>
  <section id="detailView" class="detail-view" hidden></section>
</main>
<nav class="bottom-toolbar" aria-label="하단 고정 탐색">
  <button type="button" data-mode="special">특수</button>
  <button type="button" data-mode="cat_form" class="active">캐릭터 도감</button>
  <button type="button" data-mode="enemy">적 도감</button>
  <button type="button" data-mode="stage">스테이지</button>
</nav>
<script src="js/layout-v030.js"></script>
<script src="js/data-loader-v037.js"></script>
<script src="js/image-resolver-v037.js"></script>
<script src="js/deck-engine-v036.js"></script>
<script src="js/roster-v035.js"></script>
<script src="js/encyclopedia-v037.js"></script>
</body>
</html>
