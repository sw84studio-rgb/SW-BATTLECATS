<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SW BATTLE CATS 백과</title>
<script>
(function(){
  'use strict';
  var DEFAULT_GAME_ORIGIN='https://sw-nbb.onrender.com';
  var TOKEN_PARAM='swLaunchToken',NONCE_PARAM='swLaunchNonce';
  var embedded=false;try{embedded=window.parent!==window}catch(e){embedded=false}
  function safeOrigin(v){try{var u=new URL(String(v||''));return /^https?:$/.test(u.protocol)?u.origin:''}catch(e){return''}}
  var q=new URLSearchParams(location.search);
  var gameOrigin=safeOrigin(q.get('swGameOrigin'))||DEFAULT_GAME_ORIGIN;
  window.__SWBC_GAME_ORIGIN__=gameOrigin;
  window.__SWBC_EMBEDDED__=embedded;
  document.documentElement.style.visibility='hidden';
  function returnToGame(){try{var u=new URL(gameOrigin);u.searchParams.set('returnApp','battle_cats');location.replace(u.href)}catch(e){location.replace(DEFAULT_GAME_ORIGIN+'?returnApp=battle_cats')}}
  function scrub(){try{var u=new URL(location.href);[TOKEN_PARAM,NONCE_PARAM,'swGameOrigin','_swLaunch','_swSession'].forEach(function(k){u.searchParams.delete(k)});history.replaceState(null,'',u.pathname+(u.search||'')+(u.hash||''))}catch(e){}}
  async function verify(){
    var token=String(q.get(TOKEN_PARAM)||''),nonce=String(q.get(NONCE_PARAM)||'');
    if(!token||!nonce){if(!embedded)returnToGame();return false}
    try{
      var r=await fetch(gameOrigin+'/api/battle-cats/launch/verify',{method:'POST',mode:'cors',cache:'no-store',credentials:'omit',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token,nonce:nonce})});
      var d={};try{d=await r.json()}catch(e){}
      if(!r.ok||!d||d.ok!==true||d.launch!==true)throw new Error((d&&d.error)||'냥코 대전쟁 실행 권한을 확인하지 못했습니다.');
      scrub();document.documentElement.style.visibility='';window.__SWBC_ACCESS_ALLOWED__=true;return true;
    }catch(e){
      scrub();window.__SWBC_ACCESS_ALLOWED__=false;
      if(!embedded){returnToGame();return false}
      try{window.parent.postMessage({type:'SW_BATTLE_CATS_REQUEST_RECONNECT'},gameOrigin)}catch(_){}
      return false;
    }
  }
  window.__SWBC_ACCESS_PROMISE__=verify();
})();
</script>
<link rel="stylesheet" href="css/encyclopedia-v097.css">
</head>
<body>
<header class="app-header">
  <button class="header-home" type="button" data-action="home">홈으로</button>
  <div class="brand">SW BATTLE CATS</div>
  <div class="version"><b id="releaseVersion"></b><small id="releaseNote"></small></div>
</header>
<div class="search-shell">
  <div class="search-inner" aria-label="검색 및 게임 판본">
    <input id="searchInput" type="search" placeholder="캐릭터 이름 검색" autocomplete="off">
    <button type="button" data-platform="mobile" class="platform-btn active">모바일</button>
    <button type="button" data-platform="switch" class="platform-btn">닌텐도</button>
  </div>
</div>
<main id="app" class="app-main" aria-live="polite">
  <section id="catalogView" class="catalog-view">
    <div class="view-head"><div><h1 id="viewTitle">캐릭터 도감</h1><p id="viewSubtitle"></p></div><div id="resultCount" class="catalog-meta">0개</div></div>
    <div id="contentView"></div>
  </section>
  <section id="detailView" class="detail-view" hidden></section>
</main>
<nav class="bottom-toolbar" aria-label="하단 고정 탐색">
  <button type="button" data-mode="special">특수</button>
  <button type="button" data-mode="cat_form" class="active">캐릭터 도감</button>
  <button type="button" data-mode="enemy">적 도감</button>
  <button type="button" data-mode="stage">스테이지</button>
</nav>
<script>
(function(){
  var sources=['js/layout-v030.js','js/data-loader-v116.js','js/image-resolver-v038.js','js/deck-engine-v036.js','js/roster-v035.js','js/marks-v098.js','js/encyclopedia-v117.js'];
  function loadOne(src){return new Promise(function(resolve,reject){var el=document.createElement('script');el.src=src;el.onload=resolve;el.onerror=reject;document.body.appendChild(el)})}
  Promise.resolve(window.__SWBC_ACCESS_PROMISE__).then(async function(ok){if(!ok)return;for(var i=0;i<sources.length;i++)await loadOne(sources[i])}).catch(function(err){console.error('SW BATTLE CATS boot',err)});
})();
</script>
</body>
</html>
